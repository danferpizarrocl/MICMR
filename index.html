<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>MiCMR</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f6df0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="version.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap">
<style>
/* Plan visual: app de finanzas personales, fondo gris azulado, acento azul y 5 colores de apoyo para botones grandes. Tarjetas blancas, botones de colores sólidos. */
:root{--bg:#f3f5fa;--card:#ffffff;--fg:#16202f;--mu:#667389;--bd:#e2e7f0;--a:#2f6df0;--al:#2f6df0;--p:#7a5af5;--t:#12a3b3;--o:#ee9a22;--g:#1b9a6b;--r:#dc4b48;--b:#8c99b3;--soft:#e8efff;--shadow:0 1px 2px rgba(20,32,60,.06),0 6px 18px rgba(20,32,60,.05);--font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#18202e;--fg:#e9eef7;--mu:#97a4bc;--bd:#283247;--a:#3f78f2;--al:#7ea6ff;--p:#7a5af5;--t:#12a3b3;--o:#e9921d;--g:#1b9a6b;--r:#dc4b48;--b:#7d8aa5;--soft:#1d2a47;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#18202e;--fg:#e9eef7;--mu:#97a4bc;--bd:#283247;--a:#3f78f2;--al:#7ea6ff;--p:#7a5af5;--t:#12a3b3;--o:#e9921d;--g:#1b9a6b;--r:#dc4b48;--b:#7d8aa5;--soft:#1d2a47;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.35;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--al);outline-offset:2px}
.hd{display:flex;flex-direction:column;gap:6px}
.hi{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.sub{margin:0;color:var(--mu);font-size:13px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:2px;color:var(--al);font-weight:700;font-size:14px;padding:4px 2px}
.ct{display:flex;align-items:center;gap:9px;margin:0;font-size:15px;font-weight:800}
.ct.sm{font-size:12.5px}
.ic{width:24px;height:24px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;flex:none}
.ct.sm .ic{width:20px;height:20px;border-radius:7px}
.ct .u{border-bottom:2.5px solid;padding-bottom:1px}
.hd .ct{font-size:24px}
.hd .ct .ic{width:30px;height:30px;border-radius:10px}
.hd .ct .ic svg{width:17px;height:17px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card.mini{gap:6px;padding:12px}
.mv{font-size:20px;font-weight:800;letter-spacing:-.01em}
.mini .mv{font-size:19px}
.ms{color:var(--mu);font-size:12px;overflow-wrap:anywhere}
.hero{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--al);font-variant-numeric:tabular-nums}
.hero.s{font-size:34px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g2>*{min-width:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden}.bar>div{height:100%;border-radius:6px}
.lnk{color:var(--al);font-weight:700;font-size:12.5px;padding:2px 0}.lnk.r{align-self:flex-end}
.dl{font-weight:800;font-size:13px}.dl.up{color:var(--r)}.dl.dn{color:var(--g)}
.chip{display:inline-block;color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--o)}
.chip.s{font-size:9.5px;padding:3px 8px}
.sem{display:flex;gap:12px;align-items:center}
.gw{position:relative;width:140px;flex:none}.gg{width:140px;display:block}
.gc{position:absolute;left:0;right:0;bottom:2px;text-align:center;display:flex;flex-direction:column;line-height:1.1}.gc b{font-size:16px}.gc span{font-size:11px;color:var(--mu)}
.gt{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px}
.hero2{background:var(--soft);border:1.5px solid var(--a);border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;width:100%}
.hero2 i{font-style:normal;display:block;font-size:12px;color:var(--mu)}.hero2 b{font-size:28px;color:var(--al);letter-spacing:-.02em}.hero2 .r{text-align:right}.hero2 u{text-decoration:none;color:var(--al);font-weight:800;font-size:13px;display:inline-flex;align-items:center}
.lst{display:flex;flex-direction:column}
.lst>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}
.lst>div:last-child{border-bottom:0}
.lst span{display:flex;flex-direction:column;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lst em{font-style:normal;font-weight:400;font-size:11.5px;color:var(--mu)}
.lst b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.sec{margin:6px 2px 0;font-size:14px;font-weight:800}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tg.y3{grid-template-columns:repeat(3,1fr);gap:10px}
.tile{color:#fff;border-radius:22px;padding:18px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .tt{font-size:20px;font-weight:800}.tile .ts{font-size:12px;opacity:.92;line-height:1.25}
.tile.s{min-height:104px;padding:12px 8px;border-radius:18px}.tile.s .tt{font-size:15px}.tile.s .ts{font-size:11px}
.tile.yr{min-height:104px;align-items:flex-start;text-align:left;padding:14px;position:relative;justify-content:flex-end}
.tile.yr .by{font-size:34px;font-weight:800;line-height:1}.tile.yr .chip{position:absolute;right:10px;top:10px}
.tile.ph{border:2px dashed var(--b);color:var(--mu);background:transparent;box-shadow:none;min-height:104px}
.tile.ys{min-height:64px;background:var(--card);color:var(--mu);border:1.5px solid var(--bd);font-size:22px;font-weight:800;box-shadow:none;padding:8px}
.tile.ys:disabled{opacity:.35}
.stack{display:flex;flex-direction:column;gap:14px}
.big{position:relative;color:#fff;border-radius:24px;padding:20px 64px 20px 20px;width:100%;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);justify-content:center}
.big:active{transform:scale(.985)}
.big.xl{min-height:210px}.big.l{min-height:112px}
.big .by{font-size:62px;font-weight:800;line-height:1;letter-spacing:-.03em}
.big .bt{font-size:24px;font-weight:800}.big .bs{font-size:14px;font-weight:700}.big .bs.s{font-weight:500;opacity:.85;font-size:12.5px}
.big .bi{position:absolute;right:18px;top:50%;transform:translateY(-50%);opacity:.95}
.big .chip{align-self:flex-start;margin-bottom:6px}
.wideb{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#efeaff;border:1.5px solid var(--p);color:var(--p);border-radius:18px;padding:16px;width:100%}
.wideb b{display:block;font-size:17px}.wideb em{font-style:normal;font-size:12px;color:var(--mu)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wideb{background:#251f45;color:#b9a6ff}}
:root[data-theme="dark"] .wideb{background:#251f45;color:#b9a6ff}
.pick{text-align:center;font-weight:800;font-size:20px;color:var(--t);background:var(--card);border:1.5px solid var(--t);border-radius:16px;padding:14px}
.btn{background:var(--a);color:#fff;font-weight:800;font-size:15px;border-radius:14px;padding:14px 18px;display:inline-flex;justify-content:center;align-items:center;gap:6px;text-align:center}
.btn.ghost{background:transparent;color:var(--al);border:1.5px solid var(--a)}
.btn.wide{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nx{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.inp{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--bd);background:var(--card);color:var(--fg)}
textarea.inp{font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:8px 12px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);font-weight:700;font-size:13px;color:var(--mu);text-transform:capitalize}
.chips button.on{background:var(--a);border-color:var(--a);color:#fff}.chips button.off{opacity:.45}
.seg{display:inline-flex;background:var(--bd);border-radius:12px;padding:3px;align-self:flex-start}
.seg button{padding:7px 16px;border-radius:9px;font-weight:700;color:var(--mu)}.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.menu{display:flex;flex-direction:column;gap:10px}
.mi{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;color:var(--mu)}
.mi>span:nth-child(2){flex:1;display:flex;flex-direction:column}.mi b{color:var(--fg);font-size:16px}.mi em{font-style:normal;font-size:12px}
.mic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.note{color:var(--mu);font-size:12px;margin:4px 2px}
.emp{align-items:center;text-align:center;padding:26px 18px;gap:12px}.emp h2{margin:0;font-size:20px}.emp p{margin:0;color:var(--mu)}
.eic{width:64px;height:64px;border-radius:50%;background:var(--soft);color:var(--al);display:grid;place-items:center}
.okb{display:flex;align-items:center;gap:6px;background:rgba(27,154,107,.13);color:var(--g);border-radius:12px;padding:10px 12px;font-weight:700;font-size:12.5px}
.chart{width:100%;height:auto;display:block}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mu);font-weight:600}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{display:flex;flex-direction:column;gap:11px}
.hl{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
.hn{display:flex;gap:7px;min-width:0;overflow-wrap:anywhere}.hn b{color:var(--mu);min-width:20px;flex:none}
.hv{white-space:nowrap;font-variant-numeric:tabular-nums}.hv em{font-style:normal;font-weight:500;color:var(--mu);font-size:11.5px}
.ht{height:9px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:5px}.ht>div{height:100%;border-radius:5px}
.sp{display:flex;height:14px;border-radius:7px;overflow:hidden}.sp.s{flex:1;height:10px}
.spl{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin-top:6px;color:var(--mu)}.spl i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.spl b{color:var(--fg)}
.stk{gap:10px!important;align-items:center!important}.stk span{width:34px;flex:none}
.hm{display:grid;grid-template-columns:34px repeat(12,1fr);gap:3px;font-size:10px}
.hh{text-align:center;color:var(--mu);font-weight:700}.hy{font-weight:800;align-self:center}
.hc{border-radius:5px;min-height:26px;display:grid;place-items:center;font-size:9.5px;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:flex;flex-direction:column}.kv>div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd)}.kv>div:last-child{border:0}.kv span{color:var(--mu)}.kv b{text-align:right}
.cmp{display:flex;flex-direction:column}
.ch,.cr{display:grid;grid-template-columns:1.5fr 1fr 1fr .9fr;gap:6px;align-items:center;padding:8px 0;font-size:12.5px}
.cr{border-top:1px solid var(--bd)}.cr b{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}.ch b{text-align:right;font-size:14px}
.cr em{font-style:normal;font-weight:800;font-size:11.5px;text-align:right}.upc{color:var(--r)}.dnc{color:var(--g)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;font-size:13px;max-width:min(92vw,460px);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--r);color:#fff}
.nv{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:20}
.nv-in{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:520px}
.nv button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:14px;color:var(--mu);font-size:11.5px;font-weight:700}
.nv button.on{background:var(--soft);color:var(--al)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hd{position:relative;padding-right:50px}
.tgl{position:absolute;right:0;top:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);color:var(--fg);box-shadow:var(--shadow)}
.tgl:active{transform:scale(.94)}

.rk{display:flex;gap:3px;align-items:flex-end}
.rk>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}
.rk i{display:block;width:100%;border-radius:3px 3px 0 0;margin-top:2px}
.rk .rv{font-size:8.5px;color:var(--mu);white-space:nowrap}.rk .rv.on{font-weight:800;color:var(--fg)}
.rk b{font-size:10.5px;margin-top:3px;font-weight:600}.rk em{font-style:normal;font-size:9.5px;color:var(--mu)}
.rk .on{color:var(--al);font-weight:800}
.cu{display:flex!important;flex-direction:column;align-items:stretch!important;gap:6px!important}
.cr1{display:flex;justify-content:space-between;gap:10px}.cr1 span{font-weight:700;overflow-wrap:anywhere}
.pb{height:9px;border-radius:5px;background:var(--o);overflow:hidden}.pb>div{height:100%}
.cr2{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}.cr2 em{font-style:normal}.cr2 strong{font-weight:700;color:var(--fg)}.cr2 .okc{color:var(--g)}

.anl{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:56vh}
.anl .big{padding:18px 16px;min-height:0}.anl .big.xl{min-height:0;height:100%;justify-content:flex-end}
.anr{display:flex;flex-direction:column;gap:12px}.anr .big{flex:1;min-height:150px;justify-content:flex-end}
.anl .big .bi{top:auto;bottom:16px;transform:none;right:14px}
.bic{position:absolute;left:16px;top:16px;opacity:.95}.anr .bic{left:auto;right:14px;top:14px}
.anl .big.xl .chip{margin-top:70px}.anl .by{font-size:46px!important}.anl .bt{font-size:20px!important}
.mm{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mm>div{display:flex;flex-direction:column;gap:2px;min-width:0}.mm span{font-size:12px;color:var(--mu)}.mm b{font-size:19px;font-variant-numeric:tabular-nums}.mm em{font-style:normal;font-size:12px;color:var(--mu);overflow-wrap:anywhere}.mm .r{text-align:right;align-items:flex-end}
.dif{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:6px}
.sh2{font-size:12px;font-weight:800;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.note2{margin-top:8px;font-style:italic}
.tapc{text-align:left;width:100%;display:block}
.lnk{color:var(--al);font-weight:700;display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.bub{display:flex;flex-wrap:wrap;gap:8px 10px;justify-content:center}.bub>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.bub>div>div{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}.bub span{font-size:11px;color:var(--mu)}
.stk{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.stk b{text-align:right}
.sp.s{height:12px}
.chips button.off{opacity:.45}
.cr1,.cr2{align-items:baseline}

/* ---- inicio: iconos centrados y grandes ---- */
.nv-in{grid-template-columns:repeat(3,1fr)!important}
.anl{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:58vh;margin-top:6px}
.anl .big,.big.l{align-items:center;text-align:center;justify-content:center;padding:16px 12px;gap:6px}
.anl .big.xl{height:100%;min-height:0}
.anr{display:flex;flex-direction:column;gap:12px}.anr .big{flex:1;min-height:150px}
.bic{position:static!important;display:grid;place-items:center;opacity:.95;margin-bottom:4px}
.big .chip{align-self:center}.anl .big.xl .chip{margin-top:0}
.anl .by{font-size:46px!important}.anl .bt{font-size:19px!important}
.big.l .bs.s{white-space:normal}
.tile .ti{display:grid;place-items:center}
.tile.yr{align-items:center;text-align:center;justify-content:center}.tile.yr .by{font-size:30px}
.grp{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.gt2{font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:14px}
details.dd>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:4px 0}

details.dd>summary>svg{transition:transform .2s}details.dd[open]>summary>svg{transform:rotate(90deg)}
.grp>.lst{margin-top:6px}

/* ---- v0.8 ---- */
.anl .big.xl{justify-content:flex-start;gap:4px}
.anl .big.xl .bic.top{margin-bottom:auto}
.anl .big.xl .by{font-size:56px!important}
.anl .big.xl .b2{font-size:27px;font-weight:800}
.anl .big.xl .b3{font-size:16px!important;opacity:.95}
.hero.rd,.ms.rd{color:var(--r)}.ms.rd{font-weight:700}
.g2.ctr .mini{align-items:center;text-align:center}.g2.ctr .mini .ct{justify-content:center}
.vr{color:var(--r);font-weight:700}.vg{color:var(--g);font-weight:700}
.mhd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mpick{display:inline-flex;align-items:center;gap:6px;background:var(--a);color:#fff;font-weight:800;font-size:14px;padding:11px 16px;border-radius:14px;box-shadow:var(--shadow)}

.mlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mlist[hidden]{display:none}

details.more .mc{display:none}details.more[open] .mc{display:inline}details.more[open] .mo{display:none}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-bottom:6px;min-height:150px}
.pod>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;text-align:center;gap:2px}
.pod .pn{font-size:11px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pod .pv{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums}

async function inflateRaw(bytes){

}

  const rows={}; let m; const re=/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  while((m=re.exec(xml))){

    const r=/\br="([A-Z]+)(\d+)"/.exec(at); if(!r) continue;

function searchRes(){
  if(!DATA) return '';
  const q=norm(SEARCH.q.trim()), qn=q.replace(/[.$\s]/g,'');
  let rows=DATA.compras.filter(c=>!c.dev);
  if(SEARCH.y!=='all') rows=rows.filter(c=>String(c.y)===SEARCH.y);
  if(q) rows=rows.filter(c=>norm(c.n).includes(q)||(/^\d+$/.test(qn)&&String(Math.abs(c.v)).includes(qn)));
  rows=rows.slice().sort((a,b)=>b.y-a.y||b.m-a.m||b.d-a.d||b.r-a.r);
  const tot=sum(rows.filter(c=>!c.dev).map(c=>c.v));
  const rowH=c=>'<div><span>'+esc(c.n)+'<em>'+fdate(c)+' '+c.y+' · '+(c.dev?'devolución':c.on?'online':'tienda')+(c.c?' · '+c.c+' cuotas':'')+'</em></span><b style="'+(c.dev?'color:var(--g)':'')+'">'+ff(c.v)+'</b></div>';
  const lim=!q&&rows.length>7;
  let h='<div class="ms" style="margin:8px 0">'+(lim?'Últimas 7 de '+nn(rows.length)+' compras':nn(rows.length)+' resultados')+' · '+ff(tot)+'</div>';
  if(lim) return h+'<div class="lst">'+rows.slice(0,7).map(rowH).join('')+'</div>'+expand('Ver las '+nn(rows.length-7)+' restantes','Ocultar','<div class="lst">'+rows.slice(7).map(rowH).join('')+'</div>');
  h+='<div class="lst">'+rows.map(rowH).join('')+'</div>';
  return h+'</div>';
}

  if(el.dataset.go){ if(el.dataset.tab){ tab(+el.dataset.tab); return; } go(el.dataset.go,!!el.dataset.replace); return; }
  const [a,...p]=el.dataset.act.split(':');
  if(a==='back'){ ROUTE=STACK.pop()||'home'; render(); window.scrollTo&&window.scrollTo(0,SPOS[ROUTE]||0); stuckUpd(); }
  else if(a==='load') $('xl').click();
  else if(a==='import') $('xj').click();
  else if(a==='export') doExport();
  else if(a==='mv'){ const y=window.scrollY; layMove(p[0],p[1],p[2]); render(); window.scrollTo&&window.scrollTo(0,y); }
  else if(a==='col'){ const d=el.closest('details'); if(d){ d.open=false; try{ d.scrollIntoView({block:'center'}); }catch(e){} } }
  else if(a==='lyreset'){ const y=window.scrollY; delete LAY[p[0]]; laySave(); render(); window.scrollTo&&window.scrollTo(0,y); }
  else if(a==='edit'){ EDIT=p[0]; EDITR=ROUTE; render(); }
  else if(a==='edend'){ EDIT=null; render(); }
  else if(a==='copyexp'){ const t=$('expta'); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>toast('Selecciona el texto y cópialo a mano',true)); }catch(x){ toast('Selecciona el texto y cópialo a mano',true); } }
  else if(a==='mode'){ MODE=p[0]==='u'?1:0; const y=window.scrollY; render(); window.scrollTo&&window.scrollTo(0,y); }
  else if(a==='mpick'){ const l=el.closest('.mpw').querySelector('.mlist'); if(l){ l.hidden=!l.hidden; el.classList.toggle('open',!l.hidden); } }
  else if(a==='msel'){ const yy=+p[0], mm=+p[1]; MSEL['y'+yy]=mm; const bx=$('mb'); if(bx){ bx.innerHTML=monthBlock(yy,mm,true); fitNotes(); } else render(); }
  else if(a==='cpick'){ MSEL[p[0]]=+p[1]; render(); }
  else if(a==='sy'){ SEARCH.y=p[0]; render(); const q=$('q'); if(q) q.focus(); }
  else if(a==='theme'){ const y=window.scrollY||0; themeToggle(); render(); window.scrollTo&&window.scrollTo(0,y); stuckUpd(); }
  else if(a==='reset'){ STACK=[]; ROUTE='home'; render(); }
});
function stuckUpd(){ try{ const h=document.querySelector('.hdt'); const hh=h?h.offsetHeight:0; document.documentElement.style.setProperty('--hdh',hh+'px'); if(h) h.classList.toggle('stuck',h.getBoundingClientRect().top<=1); const w=document.querySelector('.mswrap'); if(w) w.classList.toggle('stuck',w.getBoundingClientRect().top<=hh+1); }catch(e){} }
window.addEventListener&&window.addEventListener('scroll',stuckUpd,{passive:true});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ SEARCH.q=e.target.value; const r=$('res'); if(r) r.innerHTML=searchRes(); } });
document.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  if(e.target.id==='xl') loadExcel(f); else if(e.target.id==='xj') importJson(f); e.target.value='';
});
themeApply(); loadAll(); render();


(function(){document.querySelectorAll('.nv button').forEach(function(b){var m=b.innerHTML.match(/@@(\w+)@@/);if(m)b.innerHTML=b.innerHTML.replace(m[0],svgI(m[1],22,2));});})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
